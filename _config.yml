title: "Fatima Galaudu"
email: ""
description: "Backend developer. Python, Django, systems."
url: "https://portfolio.yedite.ch"
baseurl: ""

include:
  - _pages


theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "dirt"

author:
  name: "Fatima Galaudu"
  avatar: "/assets/images/avatar.jpeg"
  bio: "Backend engineer with 10+ years building robust systems — from data pipelines to payment infrastructure. MSc UCL. Ex JP Morgan. Currently open to mid-to-senior backend roles in the UK."
  location: "UK"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/girlprog"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/fatima-galaudu/"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      share: false
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false 

permalink: /:year/:month/:day/:title/
paginate: 10
paginate_path: /page:num/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache