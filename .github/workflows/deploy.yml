name: Build and Deploy Jekyll

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Deploy to Opalstack via rsync
        uses: burntsushi/rsync-deployments@v1
        with:
          switches: -avzr --delete
          path: _site/
          remote_path: /home/yourusername/apps/blog/
          remote_host: ${{ secrets.OPALSTACK_HOST }}
          remote_user: ${{ secrets.USER }}
          remote_key: ${{ secrets.OPALSTACK_SSH_KEY }}